"on":
  push:
    branches: [pull-model, main]

jobs:
  Setup_and_test:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v3

      - name: Node cache
        uses: actions/cache@v3
        with:
          path: ./app/node_modules
          key: yarn-${{ hashFiles('app/yarn.lock') }}-${{ runner.os }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: YARN install
        working-directory: ./app
        run: yarn install

      - name: Test
        working-directory: ./app
        env:
          SQLITE_DB_LOCATION: /tmp/todos/test.db
        run: mkdir -p /tmp/todos && yarn test

  Code_analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v3

      - name: Init
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "javascript"

  Build_and_scan:
    needs: Setup_and_test
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      security-events: write

    steps:
      - uses: actions/checkout@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DH_USERNAME }}
          password: ${{ secrets.DH_PASS }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t imarcho/myapp:${{ github.sha }} ./

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'imarcho/myapp:${{ github.sha }}'
          format: 'sarif'
          exit-code: 0
          output: 'trivy-results.sarif'

      - name: Results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: "trivy-${{ github.sha }}"

  Deploy:
    needs: [Build_and_scan, Code_analysis]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v3

      - name: Update manifest with new image tag
        run: |
          sed -i "s|image: imarcho/myapp.*|image: imarcho/myapp:pull_v1|g" manifests/deployment.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ImArcho/to-do-app.git
          git add manifests/deployment.yaml
          git commit -m "Image updated" || echo "Image already up to date"
          git push
