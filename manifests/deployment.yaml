apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: default
  labels:
    app: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: imarcho/myapp:7927968439ae5ea6fa96e9c6221f8881d7574c11
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: SQLITE_DB_LOCATION
              value: "/data/todos.db"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
