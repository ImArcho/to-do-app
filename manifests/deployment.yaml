apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: default
  labels:
    app: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: imarcho/myapp:da19b258b4049a4d6c99a4bb77ded667e8094b2d
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: SQLITE_DB_LOCATION
              value: "/data/todos.db"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
